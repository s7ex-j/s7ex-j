name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Languages (dark theme)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: s7ex-j
          filename: assets/metrics.languages-dark.svg
          base: ""
          config_timezone: America/Lima
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          style_density: 0
          style_background: "0d1117"
          style_border: 242933
          style_fill: 58a6ff
          style_muted: 8b949e

      - name: Languages (light theme)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: s7ex-j
          filename: assets/metrics.languages-light.svg
          base: ""
          config_timezone: America/Lima
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          style_density: 0
          style_background: "fbfbfb"
          style_border: 30363d
          style_fill: 2f81f7
          style_muted: 57606a

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.languages-dark.svg assets/metrics.languages-light.svg
          git diff --staged --quiet || git commit -m "chore: refresh language metrics"
          git push
