name: Charts and cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/skills.json"
      - "assets/langmix.json"
      - "assets/projects.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - "scripts/banner/generate.py"
      - "scripts/banner/requirements.txt"
      - "scripts/banner/logos/"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install dependencies for radar & cards
      - name: Install Python deps
        run: |
          pip install numpy pillow scipy requests

      # Hand-authored skill radar (edit assets/skills.json to change it)
      - name: Skill radar
        run: |
          python scripts/radar.py --data assets/skills.json -o assets/radar
          mv assets/radar/radar-dark.svg assets/radar-dark.svg
          mv assets/radar/radar-light.svg assets/radar-light.svg
          rm -rf assets/radar

      # Hand-authored contract & language stack radar (edit assets/langmix.json)
      - name: Language radar
        run: |
          python scripts/radar.py --data assets/langmix.json -o assets/radar-langs --values
          mv assets/radar-langs/radar-langs-dark.svg assets/radar-langs-dark.svg
          mv assets/radar-langs/radar-langs-light.svg assets/radar-langs-light.svg
          rm -rf assets/radar-langs

      # Self-hosted stat and repo cards. These replace github-readme-stats and
      # github-profile-trophy, whose shared public instances return 503 and 402.
      # METRICS_TOKEN is a PAT and can read the contribution graph; the built-in
      # GITHUB_TOKEN is the fallback and just means fewer tiles.
      - name: Stat and repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets
          # Static fallback for non-picture-aware renderers
          cp assets/metrics.languages-dark.svg assets/metrics.languages.svg || true

      # Animated banner (dark + light)
      - name: Animated banner
        run: |
          pip install -r scripts/banner/requirements.txt
          python scripts/banner/generate.py

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          ref: output
          path: output

      - name: Copy assets to output branch
        run: |
          cp assets/radar-*.svg output/assets/
          cp assets/radar-langs-*.svg output/assets/
          cp assets/card-*.svg output/assets/
          cp assets/metrics.languages-*.svg output/assets/
          cp assets/banner-*.svg output/assets/
          cp assets/metrics.languages.svg output/assets/ || true

      - name: Commit if changed
        run: |
          cd output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/radar-langs-*.svg assets/card-*.svg assets/metrics.languages-*.svg assets/banner-*.svg assets/metrics.languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts, cards, and banner"
          git push origin output
